<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Clyde Body's Booking Form</h1>

        <form>

            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname"
                   placeholder="Enter your full name" required>


            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email address" required>


            <label for="service">Service Type</label>
            <select id="service" name="service" required>
                <option value="">Select a service</option>
                <option value="consultation">Consultation</option>
                <option value="event-pass">Event Pass</option>
                <option value="reservation">Reservation</option>
            </select>


            <label for="date">Booking Date</label>
            <input type="date" id="date" name="date" required>


            <label for="time">Booking Time</label>
            <input type="time" id="time" name="time" required>


            <label for="guests">Number of Guests/Seats</label>
            <input type="number" id="guests" name="guests"
                   min="1" placeholder="Enter number of guests" required>


            <label for="requests">Special Requests</label>
            <textarea id="requests" name="requests"
                      placeholder="Enter your special requests"></textarea>


            <button type="submit">Submit Booking</button>

        </form>

    </div>

</body>

</html>
