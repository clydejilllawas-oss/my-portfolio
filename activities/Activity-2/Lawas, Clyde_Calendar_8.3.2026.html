<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>AUGUST CALENDAR 2026</title>


    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-style: oblique;
            font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:#11010d;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .calendar-container{
            width:400px;
            background:#e1e4c0;
            border-radius:10px;
            box-shadow:0 5px 15px rgba(0,0,0,.15);
            padding:20px;
        }

        h2{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            text-align:center;
            font-size:xx-large;
            color:#290324;
            margin-bottom:20px;
        }

        h3{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            text-align:center;
            font-size:medium;
            color:#5c6304;
            margin-bottom:20px;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th{
            background:#243b04;
            color:white;
            padding:10px;
            border:1px solid #ece8e8;
        }

        td{
            height:60px;
            text-align:center;
            vertical-align:top;
            border:1px solid #ddd;
            font-weight:bold;
            transition:0.3s;
        }

        td:hover{
            background:#455666;
            cursor:pointer;
        }

        .regular-day{
            color:#02530d;
        }

        .holiday{
            color:#c00b04;
        }

        .holiday-name{
            display:block;
            font-size:10px;
            font-weight:normal;
            margin-top:4px;
            color:#d9534f;
        }

        .empty-day{
            background:#e4e1e1;
        }

        .today{
            background:#011307;
            color:rgb(95, 91, 91);
            border-radius:50%;
            width:35px;
            height:35px;
            margin:auto;
            display:flex;
            justify-content:center;
            align-items:center;
            margin-top:10px;
        }

    </style>

</head>
<body>

<div class="calendar-container">

    <h2>August Calendar 2026</h2>
    <h3> CLYDE JILL J. LAWAS </h3>
    <p>BSOA4</p>
    <U>Web Design</U>

    <table>

        </tbody>

    </table>

</div>

</body>
</html>
